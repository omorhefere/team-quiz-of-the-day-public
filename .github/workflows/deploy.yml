name: Deploy

# Deploys on merge to main. The content smoke test (T10) gates the deploy:
# if today's deck is missing or invalid, the job fails and traffic is NOT
# flipped — the daily ritual can't be broken by a bad deploy.
#
# Required repo secrets:
#   DATABASE_URL   — production Postgres connection string (Neon/Supabase/Fly)
#   FLY_API_TOKEN  — Fly.io deploy token (or swap the deploy step for your host)

on:
  push:
    branches: [main, master]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Pre-deploy content smoke test
        run: npm run smoke

      - name: Deploy to Fly.io
        uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
